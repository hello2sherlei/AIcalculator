<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Time Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="draggable">
    <!-- 头部 -->
    <div class="header">
      <h1 class="title">AI Time Tracker</h1>
      <div class="header-buttons">
        <button id="settingsBtn" class="icon-btn" title="设置">⚙️</button>
        <button id="minimizeBtn" class="icon-btn" title="最小化">−</button>
        <button id="closeBtn" class="icon-btn" title="隐藏到托盘">×</button>
      </div>
    </div>

    <!-- 工具列表 -->
    <div id="toolsList" class="tools-list"></div>

    <!-- 统计区域 -->
    <div class="stats-area">
      <div class="stat-item">
        <span class="stat-label">今日累计：</span>
        <span id="dailyTotal" class="stat-value">00:00:00</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">本周累计：</span>
        <span id="weeklyTotal" class="stat-value">00:00:00</span>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
