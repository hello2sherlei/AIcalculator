<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#grad)"/>

  <!-- Clock face -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="#ffffff" stroke-width="6"/>

  <!-- Hour hand -->
  <line x1="128" y1="128" x2="128" y2="80" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Minute hand -->
  <line x1="128" y1="128" x2="168" y2="128" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="128" cy="128" r="8" fill="#ffffff"/>

  <!-- AI Text -->
  <text x="128" y="200" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">AI</text>
</svg>
