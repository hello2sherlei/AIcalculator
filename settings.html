<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - AI Time Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #ffffff;
      padding: 20px;
    }

    .container {
      max-width: 460px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 24px;
      color: #00d4ff;
    }

    .section {
      background: rgba(30, 30, 40, 0.8);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(100, 100, 120, 0.3);
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #00d4ff;
    }

    .tool-setting {
      background: rgba(20, 20, 30, 0.6);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .tool-setting:last-child {
      margin-bottom: 0;
    }

    .input-group {
      margin-bottom: 8px;
    }

    .input-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(100, 100, 120, 0.4);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #00d4ff;
    }

    .time-adjust {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .time-adjust button {
      flex: 1;
      background: linear-gradient(135deg, #0066ff, #00d4ff);
      border: none;
      color: #ffffff;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .time-adjust button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0, 212, 255, 0.4);
    }

    .time-adjust button.decrease {
      background: linear-gradient(135deg, #ff4444, #ff0000);
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: #00d4ff;
      border-radius: 50%;
      cursor: pointer;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      background: linear-gradient(135deg, #0066ff, #00d4ff);
      border: none;
      color: #ffffff;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 212, 255, 0.4);
    }

    .btn.secondary {
      background: linear-gradient(135deg, #666, #444);
    }

    .current-value {
      display: inline-block;
      margin-left: 8px;
      color: #00d4ff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ 设置</h1>

    <!-- 工具配置 -->
    <div class="section">
      <div class="section-title">工具配置</div>
      <div id="toolsSettings"></div>
    </div>

    <!-- 全局设置 -->
    <div class="section">
      <div class="section-title">全局设置</div>

      <div class="input-group">
        <label>
          窗口透明度
          <span class="current-value" id="opacityValue">85%</span>
        </label>
        <input type="range" id="opacitySlider" min="70" max="100" value="85" step="1">
      </div>

      <div class="checkbox-group" style="margin-top: 12px;">
        <input type="checkbox" id="startOnBoot">
        <label for="startOnBoot" style="margin: 0;">开机自动启动</label>
      </div>
    </div>

    <!-- 按钮 -->
    <div class="button-group">
      <button class="btn secondary" id="cancelBtn">取消</button>
      <button class="btn" id="saveBtn">保存设置</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
